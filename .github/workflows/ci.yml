name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: |
          echo "tested_sha=${{ github.sha }}" > evidence.txt
          echo "pr_head_sha=${{ github.event.pull_request.head.sha }}" >> evidence.txt
          echo "run_id=${{ github.run_id }}" >> evidence.txt
          echo "trigger=${{ github.event_name }}" >> evidence.txt
          echo "result=pass" >> evidence.txt
          cat evidence.txt
      - uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: evidence.txt

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Snyk scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set +e
          npx snyk@latest test --json-file-output=snyk.json
          code=$?
          echo "scanned_sha=${{ github.sha }}" > security-summary.txt
          echo "run_id=${{ github.run_id }}" >> security-summary.txt
          echo "trigger=${{ github.event_name }}" >> security-summary.txt
          echo "snyk_exit_code=$code" >> security-summary.txt
          cat security-summary.txt
          exit $code
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence
          path: |
            snyk.json
            security-summary.txt

  deploy:
    needs: [test, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Pretend deployment of ${{ github.sha }}"